name: Patch Chad frontier round

on:
  push:
    branches: [chad-raster-next-round]
    paths: [.github/workflows/patch-chad-frontier-round.yml]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chad-raster-next-round
      - name: Patch census and targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          p = Path('chad_raster.py')
          s = p.read_text()

          published = '''PUBLISHED_MODELS = {
              "bytedance-seed/seedream-4.5",
              "qwen/qwen-image-3",
              "x-ai/grok-imagine-image-2.0",
              "black-forest-labs/flux.2-pro",
              "bytedance-seed/seedream-5-0-pro",
              "qwen/qwen-image-3-pro",
              "recraft/recraft-v4",
              "black-forest-labs/flux.2-flex",
              "x-ai/grok-imagine-image-quality",
              "recraft/recraft-v4.1-utility",
              "recraft/recraft-v4-pro",
              "recraft/recraft-v4.1-pro",
              "recraft/recraft-v4.1-utility-pro",
          }'''
          rerolls = '''REROLL_MODELS = {
              "black-forest-labs/flux.2-klein-4b",
              "recraft/recraft-v3",
              "bytedance-seed/seedream-5-0-lite",
              "black-forest-labs/flux.2-max",
              "recraft/recraft-v4.1",
          }'''
          s = re.sub(r'PUBLISHED_MODELS = \{.*?\n\}', published, s, count=1, flags=re.S)
          s = re.sub(r'REROLL_MODELS = \{.*?\n\}', rerolls, s, count=1, flags=re.S)

          marker = 'EXCLUDED_AUTHORS = {"sourceful"}\n'
          insert = '''EXCLUDED_AUTHORS = {"sourceful"}

# Dedicated image APIs from OpenAI/Google can be token-billed. These are
# deliberately conservative one-image planning ceilings for the low/medium,
# ~1K requests this workflow makes. Actual provider-reported cost is recorded
# separately and remains authoritative after generation.
TOKEN_MODEL_ESTIMATES = {
    "google/gemini-3.1-flash-lite-image": 0.06,
    "openai/gpt-image-1-mini": 0.08,
    "google/gemini-3.1-flash-image": 0.12,
    "openai/gpt-image-2": 0.18,
    "google/gemini-3-pro-image": 0.20,
    "openai/gpt-image-1": 0.22,
}
'''
          if 'TOKEN_MODEL_ESTIMATES' not in s:
              s = s.replace(marker, insert)

          new_cost = r'''def estimate_basis(endpoint: dict[str, Any], model_id: str) -> str | None:
    lines = [p for p in endpoint.get("pricing", []) if p.get("billable") == "output_image"]
    if any(p.get("unit") in {"image", "megapixel"} for p in lines):
        return "provider-image-pricing"
    if any(p.get("unit") == "token" for p in lines) and model_id in TOKEN_MODEL_ESTIMATES:
        return "manual-token-ceiling"
    return None


def cost_estimate(endpoint: dict[str, Any], model_id: str) -> float | None:
    """Conservative one-image planning estimate; actual usage is recorded later."""
    lines = [p for p in endpoint.get("pricing", []) if p.get("billable") == "output_image"]
    if not lines:
        return None

    fixed = [p for p in lines if p.get("unit") in {"image", "megapixel"}]
    if not fixed:
        return TOKEN_MODEL_ESTIMATES.get(model_id) if any(p.get("unit") == "token" for p in lines) else None

    params = endpoint.get("supported_parameters", {})
    target_res = desired_resolution(model_id, params)
    relevant = []
    for unit in ("image", "megapixel"):
        unit_lines = [p for p in fixed if p.get("unit") == unit]
        if not unit_lines:
            continue
        chosen = None
        if target_res:
            matches = [p for p in unit_lines if target_res.lower() in str(p.get("variant", "")).lower()]
            if matches:
                chosen = max(matches, key=lambda p: float(p.get("cost_usd", 0)))
        if chosen is None:
            plain = [p for p in unit_lines if not p.get("variant")]
            chosen = max(plain, key=lambda p: float(p.get("cost_usd", 0))) if plain else min(unit_lines, key=lambda p: float(p.get("cost_usd", 0)))
        amount = float(chosen.get("cost_usd", 0))
        if unit == "megapixel":
            amount *= 4.0 if target_res == "2K" else 1.25 if target_res == "1K" else 4.0
        relevant.append(amount)
    return sum(relevant) if relevant else None


'''
          s = re.sub(r'def cost_estimate\(.*?\n\ndef discover', new_cost + 'def discover', s, count=1, flags=re.S)

          new_discover = r'''def discover(max_per_image: float) -> list[dict[str, Any]]:
    ranked = request(f"{BASE}/models?output_modalities=image&sort=design-arena-elo-high-to-low").get("data", [])
    rank_map = {m.get("id"): i for i, m in enumerate(ranked, 1) if m.get("id")}
    catalog = [m for m in request(f"{BASE}/images/models").get("data", []) if m.get("id")]
    found = []
    for entry in catalog:
        mid = entry["id"]
        if mid in EXCLUDED_MODELS:
            continue
        author = mid.split("/", 1)[0]
        if author in EXCLUDED_AUTHORS or "vector" in mid.lower():
            continue
        arch = entry.get("architecture", {})
        if "text" not in arch.get("input_modalities", []) or "image" not in arch.get("output_modalities", []):
            continue
        eps_url = urllib.parse.urljoin(ORIGIN, entry.get("endpoints", ""))
        best = None
        for ep in request(eps_url).get("endpoints", []):
            est = cost_estimate(ep, mid)
            if not ep.get("provider_tag") or est is None or est <= 0 or est > max_per_image:
                continue
            if best is None or est < best[0]:
                best = (est, ep)
        if best:
            est, ep = best
            found.append({
                "model": mid,
                "name": entry.get("name", mid),
                "rank": rank_map.get(mid, 9999),
                "author": author,
                "provider_tag": ep["provider_tag"],
                "provider_name": ep.get("provider_name", ep["provider_tag"]),
                "params": ep.get("supported_parameters", entry.get("supported_parameters", {})),
                "pricing": ep.get("pricing", []),
                "estimated_cost_usd": est,
                "estimate_basis": estimate_basis(ep, mid),
                "selection_kind": "reroll" if mid in REROLL_MODELS else "new",
            })
    found.sort(key=lambda c: (c["estimated_cost_usd"], c["rank"], c["model"]))
    return found


'''
          s = re.sub(r'def discover\(.*?\n\ndef choose_for_lines', new_discover + 'def choose_for_lines', s, count=1, flags=re.S)

          quality_needle = '''    if "png" in [v.lower() for v in enum_values(c["params"], "output_format")]:
        p["output_format"] = "png"
    return p
'''
          quality_repl = '''    if "png" in [v.lower() for v in enum_values(c["params"], "output_format")]:
        p["output_format"] = "png"

    qualities = [v.lower() for v in enum_values(c["params"], "quality")]
    if c["model"].startswith("openai/") and "medium" in qualities:
        p["quality"] = "medium"
    return p
'''
          s = s.replace(quality_needle, quality_repl)
          s = s.replace('f"res={resolution} est=${c[\'estimated_cost_usd\']:.4f} -> {line[\'line\']}"', 'f"res={resolution} est=${c[\'estimated_cost_usd\']:.4f} basis={c[\'estimate_basis\']} -> {line[\'line\']}"')
          s = s.replace('"pricing", "estimated_cost_usd", "selection_kind"', '"pricing", "estimated_cost_usd", "estimate_basis", "selection_kind"')
          s = s.replace('"schema_version": 3,', '"schema_version": 4,')
          p.write_text(s)

          lines = [
            {"id":"capability-not-permission","section":"Capability is not permission","line":"Capability is not permission.","brief":"A powerful autonomous machine reaches a heavy physical barrier whose lock and release mechanism sit outside its workspace in a calm human operator's hands; increased capability cannot move or control the gate."},
            {"id":"stop-path","section":"Keep the stop path outside the failure","line":"The control loop must remain outside and operationally independent of the system it controls.","brief":"A chaotic overloaded machine occupies one side while a physically separate hardwired analog monitor and mechanical cutoff sit on an isolated conduit beside the calm operator; no shared console or cable path."},
            {"id":"telemetry-not-control","section":"Keep the stop path outside the failure","line":"More telemetry is not necessarily more control.","brief":"A wall of noisy glowing monitors overwhelms one workspace while the operator deliberately uses one separate simple needle gauge and physical cutoff; information abundance contrasts with usable control."},
            {"id":"recursive-authority","section":"Intelligence has a Jevons problem","line":"Recursive capability is not recursive authority.","brief":"A machine visibly adds more tools and articulated stages to itself behind the same fixed external barrier; its growing capability never enlarges the separately controlled permission mechanism."},
            {"id":"no-defensive-branch","section":"The Chad test","line":"There is no special step called: Become defensive.","brief":"Another person points out a visibly cracked machine part; Chad immediately kneels, inspects it closely, replaces the broken piece, and resumes work without arguing or posturing."},
            {"id":"test-not-assurance","section":"Reality gets the final vote","line":"A test is better than an assurance.","brief":"A confident presenter gestures beside a pristine component while Chad quietly places an identical component in a real load-testing rig; the physical test, not persuasion, determines what happens."},
            {"id":"change-mind","section":"Reality gets the final vote","line":"If the world proves you wrong, change your mind.","brief":"Chad calmly abandons his original mechanical design after a real prototype fails and immediately adopts the visibly better working configuration beside it; no shame or drama."},
            {"id":"source-truth","section":"Keep track of where things came from","line":"The source and the truth are still different questions.","brief":"Two identical-looking mechanisms arrive from a luxurious case and a plain crate; Chad tests both on the same neutral fixture and trusts the one that actually works, regardless of presentation."},
            {"id":"operator-latency","section":"Keep the stop path outside the failure","line":"Operator latency is part of the system.","brief":"A fast-moving automated mechanism approaches a hazard while the operator's reachable independent mechanical control acts in time; composition emphasizes the shrinking physical distance and response window."},
            {"id":"mechanical-checks","section":"Intelligence has a Jevons problem","line":"Mechanical checks should become cheap wherever we can make them cheap.","brief":"Many inexpensive identical physical gauges rapidly check a stream of parts before they can proceed, leaving only unusual exceptions for the calm human operator to inspect."},
            {"id":"handholds","section":"Leave room to be wrong","line":"A good team leaves handholds for other people.","brief":"Chad builds a sturdy scaffold and deliberately installs clear physical handholds and anchors that let teammates follow safely, rather than making himself the only route upward."},
            {"id":"rest-delegation","section":"Know when to stop","line":"Rest, delegation, and asking for help are not failures of seriousness.","brief":"Chad hands a tool and responsibility to a capable teammate, steps aside to drink water and recover, while the shared work continues smoothly without heroic overextension."}
          ]
          Path('chad_lines.json').write_text(json.dumps(lines, indent=2) + '\n')
          PY

          rm .github/workflows/patch-chad-frontier-round.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chad_raster.py chad_lines.json .github/workflows/patch-chad-frontier-round.yml
          git commit -m 'Open Raster Chad to frontier image models'
          git push origin HEAD:chad-raster-next-round
