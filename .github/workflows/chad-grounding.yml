name: Ground Chad

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight candidates + free multimodal census; no inference"
        required: true
        type: boolean
        default: true
      max_models:
        description: "Concrete zero-priced multimodal models; 4 candidates each"
        required: true
        type: choice
        options:
          - "4"
          - "8"
          - "12"
        default: "8"

permissions:
  contents: read

jobs:
  census:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preflight candidate images and free-model census
        env:
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          python3 chad_grounding.py --dry-run --max-models "$MAX_MODELS"

  poll:
    if: ${{ !inputs.dry_run && github.actor == github.repository_owner }}
    environment: inference
    concurrency:
      group: wheel-inference
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run bounded zero-price Chad grounding poll
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 chad_grounding.py \
            --max-models "$MAX_MODELS" \
            --max-tokens 180 \
            --out results/chad-grounding.jsonl

      - name: Upload raw grounding opinions
        uses: actions/upload-artifact@v4
        with:
          name: chad-grounding-opinions
          path: results/chad-grounding*
          if-no-files-found: error
          retention-days: 3
