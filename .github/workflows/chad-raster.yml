name: Raster Chad

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover/rank image models and show planned spend; generate nothing"
        required: true
        type: boolean
        default: true
      max_artists:
        description: "Number of raster target slots"
        required: true
        type: choice
        options:
          - "4"
          - "6"
          - "8"
          - "12"
        default: "12"
      max_spend_usd:
        description: "Whole-run planning ceiling in USD (estimated, not provider-enforced billing cap)"
        required: true
        type: choice
        options:
          - "0.25"
          - "0.50"
          - "1.00"
          - "2.00"
          - "5.00"
        default: "5.00"
      max_per_image_usd:
        description: "Census eligibility ceiling for predictable one-image cost"
        required: true
        type: choice
        options:
          - "0.05"
          - "0.10"
          - "0.15"
          - "0.25"
          - "0.50"
        default: "0.50"

permissions:
  contents: read

jobs:
  census:
    if: ${{ inputs.dry_run && github.actor == github.repository_owner }}
    environment: inference
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Discover ranked raster artists and budget
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
          MAX_ARTISTS: ${{ inputs.max_artists }}
          MAX_SPEND: ${{ inputs.max_spend_usd }}
          MAX_PER_IMAGE: ${{ inputs.max_per_image_usd }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 -m py_compile chad_raster.py
          python3 chad_raster.py \
            --dry-run \
            --max-artists "$MAX_ARTISTS" \
            --max-spend-usd "$MAX_SPEND" \
            --max-per-image-usd "$MAX_PER_IMAGE"

  draw:
    if: ${{ !inputs.dry_run && github.actor == github.repository_owner }}
    environment: inference
    concurrency:
      group: wheel-inference
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Generate bounded cross-model Chad raster art
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
          MAX_ARTISTS: ${{ inputs.max_artists }}
          MAX_SPEND: ${{ inputs.max_spend_usd }}
          MAX_PER_IMAGE: ${{ inputs.max_per_image_usd }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 -m py_compile chad_raster.py
          python3 chad_raster.py \
            --max-artists "$MAX_ARTISTS" \
            --max-spend-usd "$MAX_SPEND" \
            --max-per-image-usd "$MAX_PER_IMAGE" \
            --out-dir results/chad-raster

      - name: Upload raster art and receipts
        uses: actions/upload-artifact@v4
        with:
          name: chad-raster-art
          path: results/chad-raster/
          if-no-files-found: error
          retention-days: 7
