name: Anon Chad

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "List free artist models and assigned philosophy lines; no inference"
        required: true
        type: boolean
        default: true
      max_models:
        description: "Number of free text models / original SVG artworks"
        required: true
        type: choice
        options:
          - "4"
          - "8"
          - "12"
        default: "8"

permissions:
  contents: read

jobs:
  census:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: List free artist models and lines
        env:
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          python3 anon_chad.py --dry-run --max-models "$MAX_MODELS"

  draw:
    if: ${{ !inputs.dry_run && github.actor == github.repository_owner }}
    environment: inference
    concurrency:
      group: wheel-inference
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Draw original Chad philosophy SVGs
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 anon_chad.py \
            --max-models "$MAX_MODELS" \
            --max-tokens 5000 \
            --out-dir results/chad-anon

      - name: Upload art, raw responses, and receipts
        uses: actions/upload-artifact@v4
        with:
          name: chad-anon-art
          path: results/chad-anon/
          if-no-files-found: error
          retention-days: 7
