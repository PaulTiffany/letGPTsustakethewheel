name: Adjust Chad next round

on:
  push:
    branches: [chad-raster-next-round]
    paths:
      - .github/workflows/adjust-chad-round.yml

permissions:
  contents: write

jobs:
  adjust:
    if: ${{ github.actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Admit two trusted published models as explicit rerolls
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json

          p = Path('chad_raster.py')
          s = p.read_text()
          old = '''REROLL_MODELS = {\n    "black-forest-labs/flux.2-klein-4b",'''
          new = '''REROLL_MODELS = {\n    # Published before, but explicitly allowed another generation on new targets.\n    "qwen/qwen-image-3-pro",\n    "x-ai/grok-imagine-image-2.0",\n    "black-forest-labs/flux.2-klein-4b",'''
          assert old in s
          s = s.replace(old, new, 1)
          old = 'EXCLUDED_MODELS = PUBLISHED_MODELS | HARD_BLOCKED_MODELS'
          new = 'EXCLUDED_MODELS = (PUBLISHED_MODELS - REROLL_MODELS) | HARD_BLOCKED_MODELS'
          assert old in s
          s = s.replace(old, new, 1)
          old = '''# These produced valid raster bytes in earlier rounds but were not accepted for\n# publication. They are explicitly eligible for a reroll, preferably on the\n# target they previously missed after its brief has been sharpened.'''
          new = '''# These produced valid raster bytes in earlier rounds and are explicitly eligible\n# for another generation. Some missed their prior target; two published models\n# are deliberately reused only on new targets to complete this round with better\n# provider diversity.'''
          assert old in s
          s = s.replace(old, new, 1)
          p.write_text(s)

          q = Path('chad_lines.json')
          lines = json.loads(q.read_text())
          byid = {x['id']: x for x in lines}
          byid['working-demo']['preferred_model'] = 'qwen/qwen-image-3-pro'
          byid['counterexample']['preferred_model'] = 'x-ai/grok-imagine-image-2.0'
          q.write_text(json.dumps(lines, indent=2) + '\n')
          PY
          python3 -m py_compile chad_raster.py
          rm .github/workflows/adjust-chad-round.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- chad_raster.py chad_lines.json .github/workflows/adjust-chad-round.yml
          git diff --cached --check
          git commit -m "Fill Chad round with trusted rerolls"
          git push origin HEAD:chad-raster-next-round
