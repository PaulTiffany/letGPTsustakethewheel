name: Harden Raster Chad census

on:
  push:
    branches: [chad-raster-next-round]
    paths:
      - '.github/workflows/harden-chad-census.yml'

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: chad-raster-next-round

      - name: Make frontier census fail-soft per model
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('chad_raster.py')
          s = p.read_text()

          old = '''def discover(max_per_image: float) -> list[dict[str, Any]]:
    ranked = request(f"{BASE}/models?output_modalities=image&sort=design-arena-elo-high-to-low").get("data", [])
    rank_map = {m.get("id"): i for i, m in enumerate(ranked, 1) if m.get("id")}
    catalog = [m for m in request(f"{BASE}/images/models").get("data", []) if m.get("id")]
    found = []
    for entry in catalog:
        mid = entry["id"]
        if mid in EXCLUDED_MODELS:
            continue
        author = mid.split("/", 1)[0]
        if author in EXCLUDED_AUTHORS or "vector" in mid.lower():
            continue
        arch = entry.get("architecture", {})
        if "text" not in arch.get("input_modalities", []) or "image" not in arch.get("output_modalities", []):
            continue
        eps_url = urllib.parse.urljoin(ORIGIN, entry.get("endpoints", ""))
        best = None
        for ep in request(eps_url).get("endpoints", []):
            est = cost_estimate(ep, mid)
            if not ep.get("provider_tag") or est is None or est <= 0 or est > max_per_image:
                continue
            if best is None or est < best[0]:
                best = (est, ep)
        if best:
            est, ep = best
            found.append({
                "model": mid,
                "name": entry.get("name", mid),
                "rank": rank_map.get(mid, 9999),
                "author": author,
                "provider_tag": ep["provider_tag"],
                "provider_name": ep.get("provider_name", ep["provider_tag"]),
                "params": ep.get("supported_parameters") or entry.get("supported_parameters", {}),
                "pricing": ep.get("pricing", []),
                "estimated_cost_usd": est,
                "estimate_basis": estimate_basis(ep, mid),
                "selection_kind": "reroll" if mid in REROLL_MODELS else "new",
            })
    found.sort(key=lambda c: (c["estimated_cost_usd"], c["rank"], c["model"]))
    return found
'''

          new = '''def discover(max_per_image: float) -> list[dict[str, Any]]:
    try:
        ranked = request(f"{BASE}/models?output_modalities=image&sort=design-arena-elo-high-to-low").get("data", [])
    except Exception as e:
        print(f"census-rank-unavailable: {type(e).__name__}: {e}")
        ranked = []
    rank_map = {m.get("id"): i for i, m in enumerate(ranked, 1) if m.get("id")}
    catalog = [m for m in request(f"{BASE}/images/models").get("data", []) if m.get("id")]
    found = []
    skipped = 0
    for entry in catalog:
        mid = entry["id"]
        if mid in EXCLUDED_MODELS:
            continue
        author = mid.split("/", 1)[0]
        if author in EXCLUDED_AUTHORS or "vector" in mid.lower():
            continue
        arch = entry.get("architecture", {})
        if "text" not in arch.get("input_modalities", []) or "image" not in arch.get("output_modalities", []):
            continue
        endpoints_path = entry.get("endpoints")
        if not endpoints_path:
            print(f"census-skip {mid}: missing endpoints path")
            skipped += 1
            continue
        eps_url = urllib.parse.urljoin(ORIGIN, endpoints_path)
        try:
            endpoint_rows = request(eps_url).get("endpoints", [])
        except Exception as e:
            print(f"census-skip {mid}: endpoint lookup {type(e).__name__}: {e}")
            skipped += 1
            continue
        best = None
        for ep in endpoint_rows:
            try:
                est = cost_estimate(ep, mid)
            except Exception as e:
                print(f"census-skip {mid}: pricing parse {type(e).__name__}: {e}")
                continue
            if not ep.get("provider_tag") or est is None or est <= 0 or est > max_per_image:
                continue
            if best is None or est < best[0]:
                best = (est, ep)
        if best:
            est, ep = best
            found.append({
                "model": mid,
                "name": entry.get("name", mid),
                "rank": rank_map.get(mid, 9999),
                "author": author,
                "provider_tag": ep["provider_tag"],
                "provider_name": ep.get("provider_name", ep["provider_tag"]),
                "params": ep.get("supported_parameters") or entry.get("supported_parameters", {}),
                "pricing": ep.get("pricing", []),
                "estimated_cost_usd": est,
                "estimate_basis": estimate_basis(ep, mid),
                "selection_kind": "reroll" if mid in REROLL_MODELS else "new",
            })
    found.sort(key=lambda c: (c["estimated_cost_usd"], c["rank"], c["model"]))
    print(f"census_candidates={len(found)} census_skipped={skipped}")
    return found
'''

          if old not in s:
              raise SystemExit('expected discover() block not found; refusing blind patch')
          p.write_text(s.replace(old, new, 1))
          PY

          python3 -m py_compile chad_raster.py
          rm .github/workflows/harden-chad-census.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- chad_raster.py .github/workflows/harden-chad-census.yml
          git commit -m 'Harden frontier image census'
          git push origin HEAD:chad-raster-next-round
