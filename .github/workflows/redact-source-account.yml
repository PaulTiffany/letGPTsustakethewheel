name: Redact source account

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/redact-source-account.yml

permissions:
  contents: write

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Redact screenshot and tracked text
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw
          import subprocess

          image_path = Path("assets/letGPTsustakethewheel.jpg")
          with Image.open(image_path) as im:
              im = im.convert("RGB")
              if im.size != (1217, 857):
                  raise SystemExit(f"Unexpected fixture size: {im.size}")
              draw = ImageDraw.Draw(im)
              # Redaction already present in the supplied replacement screenshot.
              draw.rectangle((515, 476, 612, 510), fill="black")
              # Remaining account handle in the open LinkedIn menu.
              draw.rectangle((746, 365, 793, 392), fill="black")
              im.save(image_path, format="JPEG", quality=95, subsampling=0, optimize=True)

          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          for name in filter(None, tracked):
              path = Path(name)
              if path == image_path or not path.is_file():
                  continue
              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue
              revised = text.replace("Unfollow rUv.", "Unfollow").replace("rUv", "[redacted]")
              if revised != text:
                  path.write_text(revised, encoding="utf-8")
          PY

      - name: Commit redaction
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/letGPTsustakethewheel.jpg README.md wheel.py
          if git diff --cached --quiet; then
            echo "Nothing to redact."
            exit 0
          fi
          git commit -m "Redact source account from wheel fixture"
          git push origin HEAD:main
