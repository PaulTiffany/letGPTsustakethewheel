name: Redact source header v2

on:
  push:
    paths:
      - ".github/workflows/redact-source-v2.yml"

permissions:
  contents: write

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Redact author header
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          p = 'assets/letGPTsustakethewheel.jpg'
          im = Image.open(p).convert('RGB')
          draw = ImageDraw.Draw(im)
          # Remove the visible source account/avatar header while preserving the post body.
          draw.rectangle([294, 94, 611, 190], fill=(255, 255, 255))
          im.save(p, 'JPEG', quality=92, optimize=True)
          PY

      - name: Commit redacted fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/letGPTsustakethewheel.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Redact source account header from wheel fixture"
          git push
