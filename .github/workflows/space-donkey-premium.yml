name: SpaceDonkey Premium

on:
  push:
    branches:
      - space-donkey-premium
    paths:
      - "space_donkey_premium.py"
      - "space_donkey_premium_lines.json"
      - ".github/workflows/space-donkey-premium.yml"

permissions:
  contents: read

jobs:
  sample:
    if: ${{ github.actor == github.repository_owner }}
    environment: inference
    concurrency:
      group: wheel-inference
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Premium census preflight
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 -m py_compile chad_raster.py space_donkey_premium.py
          python3 space_donkey_premium.py \
            --dry-run \
            --lines space_donkey_premium_lines.json \
            --max-artists 6 \
            --max-spend-usd 2.00 \
            --max-per-image-usd 0.50

      - name: Generate premium samples
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python3 space_donkey_premium.py \
            --lines space_donkey_premium_lines.json \
            --out-dir results/space-donkey-premium \
            --max-artists 6 \
            --max-spend-usd 2.00 \
            --max-per-image-usd 0.50

      - name: Upload premium samples and provenance
        uses: actions/upload-artifact@v4
        with:
          name: space-donkey-premium
          path: results/space-donkey-premium/
          if-no-files-found: error
          retention-days: 7
