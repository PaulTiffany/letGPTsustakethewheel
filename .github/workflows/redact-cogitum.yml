name: Redact remaining source domain

on:
  push:
    paths:
      - ".github/workflows/redact-cogitum.yml"

permissions:
  contents: write

jobs:
  redact:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Redact remaining author header text
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          p = 'assets/letGPTsustakethewheel-redacted.jpg'
          im = Image.open(p).convert('RGB')
          draw = ImageDraw.Draw(im)
          # Extend the existing white redaction across the full source header,
          # including the remaining cogitum.one text at the right.
          draw.rectangle([294, 94, 982, 190], fill=(255, 255, 255))
          im.save(p, 'JPEG', quality=92, optimize=True)
          PY

      - name: Commit redacted fixture
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/letGPTsustakethewheel-redacted.jpg
          git diff --cached --quiet && exit 0
          git commit -m "Redact remaining source domain from wheel fixture"
          git push
