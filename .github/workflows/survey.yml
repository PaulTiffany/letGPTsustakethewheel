name: Survey the wheel

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preflight fixture + census only; spend no inference"
        required: true
        type: boolean
        default: true
      max_models:
        description: "Maximum number of concrete free multimodal models"
        required: true
        type: choice
        options:
          - "4"
          - "8"
          - "12"
          - "20"
        default: "12"

permissions:
  contents: read

jobs:
  census:
    if: ${{ inputs.dry_run }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preflight fixture and census
        env:
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          python3 wheel.py --dry-run --max-models "$MAX_MODELS"

  poll:
    if: ${{ !inputs.dry_run && github.actor == github.repository_owner }}
    environment: inference
    concurrency:
      group: wheel-inference
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run bounded free-model poll
        env:
          OPENROUTER_API_KEY: ${{ secrets.WHEEL_OPENROUTER_API_KEY }}
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OPENROUTER_API_KEY"
          python3 wheel.py --max-models "$MAX_MODELS" --max-tokens 160 --out results/poll.jsonl

      - name: Upload raw opinions
        uses: actions/upload-artifact@v4
        with:
          name: wheel-opinions
          path: results/
          if-no-files-found: error
          retention-days: 3
