name: Survey the wheel

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Discover models only; spend no inference"
        required: true
        type: boolean
        default: true
      max_models:
        description: "Maximum number of image-capable models"
        required: true
        type: string
        default: "20"
      allow_paid:
        description: "Include paid models (still cheapest-first)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  survey:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run variance machine
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
          ALLOW_PAID: ${{ inputs.allow_paid }}
          MAX_MODELS: ${{ inputs.max_models }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--max-models "$MAX_MODELS")
          if [[ "$DRY_RUN" == "true" ]]; then
            args+=(--dry-run)
          fi
          if [[ "$ALLOW_PAID" == "true" ]]; then
            args+=(--allow-paid)
          fi
          python3 wheel.py "${args[@]}"

      - name: Upload raw opinions
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: wheel-opinions
          path: results/
          if-no-files-found: error
          retention-days: 3
